<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Microsoft YaHei",sans-serif}
    .root{position:relative;width:100%;height:100%;overflow:hidden;display:grid;place-items:center}
    .fit-layer{position:absolute;left:50%;top:50%;display:grid;place-items:center;transform:translate(-50%,-50%) scale(var(--fit-scale,1));transform-origin:center;visibility:hidden;will-change:transform}
    .fit-layer.ready{visibility:visible}
    .animation-layer{display:flex;flex-direction:column;align-items:center;justify-content:center;width:max-content;max-width:1200px;animation:enter var(--duration) cubic-bezier(.16,1,.3,1)}
    .animation-layer.out{animation:exit var(--duration) ease-in forwards}
    .visual{display:block;object-fit:contain;flex:none;filter:drop-shadow(0 16px 18px #0006)}
    .placeholder{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#ff7eb6,#806ff5);font-size:80px;font-weight:900;color:white}
    .message{box-sizing:border-box;text-align:center;line-height:1.45;padding:18px 30px;border-radius:28px;margin-top:8px;overflow-wrap:anywhere;word-break:normal;white-space:normal;max-width:1200px}
    .highlight{color:var(--highlight)}
    @keyframes enter{from{opacity:0;transform:translateY(45px) scale(.84);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
    @keyframes exit{to{opacity:0;transform:translateY(-30px) scale(.92);filter:blur(6px)}}
  </style>
</head>
<body>
  <div class="root" id="root"></div>
  <script src="layout-utils.js"></script>
  <script src="style-utils.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
